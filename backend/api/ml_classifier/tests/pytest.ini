[pytest]
# Pytest configuration for ML classifier tests

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    performance: Performance tests (run separately)
    integration: Integration tests
    property: Property-based tests using Hypothesis

# Output
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Coverage
[coverage:run]
source = ..
omit = 
    */tests/*
    */test_*.py

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
